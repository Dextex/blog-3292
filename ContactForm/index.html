<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive-contact-form.css" />
    <title>Blog</title>
  </head>
  <body>
    <section class="contact">
      <div class="contact_form_wrapper">
        <div class="image_content">
          <img src="./Icons/person_pin.png" alt="Contact form" />
          <h1>Contact form</h1>
        </div>
        <!--<div class="headline_content"></div>-->

        <div class="description_form">
          <h3>
            Have a question or an idea to collaborate? <br />
            Get in touchI'd love to hear from you and explore how we can work
            together.
          </h3>
        </div>
        <div class="information_collected">
          <div class="my-name"><label>What's your name?</label></div>
          <div class="my-name"><label>What's your email?</label></div>
        </div>

        <div class="help-content">
          <div class="my-help"><label>How can I help?</label></div>
        </div>

        <div class="checkbox-content">
          <div class="checkbox-container">
            <div class="container">
              <input class="checkbox" />

              <p>
                I've read the <span> privacy policy </span> and agree to the
                processing of my data as outlined.
              </p>
            </div>
          </div>
          <div class="send-info">
            <button class="button">Send</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
