<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pattaya Pulse</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./response.css" />
    </head>
    <body>
        <div class="header-background">
            <header>
                <img src="./assets/icons/logo.svg" alt="Travel Log Logo Icon" />
                <nav>
                    <ul>
                        <li>Hightlights</li>
                        <li>FAQ</li>
                        <li>Contact</li>
                    </ul>
                </nav>
            </header>
        </div>

        <div class="footer-background">
            <footer>
                <section class="more-information">
                    <div class="copyright-container">
                        <img
                            class="copyright-logo"
                            src="./assets/icons/copyright.svg"
                            alt="copyright icon"
                        />
                        <p>Travel Blog 2026</p>
                    </div>

                    <p>Imprint</p>
                    <p>Cookie Preferences</p>
                </section>
                <section class="sozial-container">
                    <img
                        class="tiktok-logo"
                        src="./assets/icons/Tiktok.svg"
                        alt="Tiktok Icon"
                    />
                    <img
                        class="youtube-logo"
                        src="./assets/icons/youtube.svg"
                        alt="Youtube Icon"
                    />
                    <img
                        class="facebook-logo"
                        src="./assets/icons/facebook.svg"
                        alt="facebook Icon"
                    />
                    <img
                        class="instagram-logo"
                        src="./assets/icons/Instagram.svg"
                        alt="Instagram Icon"
                    />
                </section>
            </footer>
        </div>
    </body>
</html>
