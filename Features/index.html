<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive-contact-form.css" />
    <title>Blog</title>
  </head>
  <body>
    <section class="contact">
      <div class="contact_form_wrapper">
        <div class="form_content_top">
          <div class="headline_content">
            <div class="image_content">
              <img src="./Icons/person_pin.png" alt="Contact form" />
              <h1>Contact form</h1>
            </div>
          </div>
          <div class="description_form">
            <h3>
              Have a question or an idea to collaborate? <br />Get in touchI'd
              love to hear from you and explore how we can work together.
            </h3>
          </div>
        </div>

        <div class="information_collected">
          <div class="my-name">
            <p class="name">
              <label>What's your name?</label>
              <input class="input-name" type="text" />
            </p>
          </div>

          <div class="my-email">
            <p class="email">
              <label>What's your email?</label>
              <input class="input-email" type="text" />
            </p>
          </div>
        </div>

        <div class="my-help">
          <p class="help">
            <label>How can I help?</label>
            <input class="input-help" type="text" />
          </p>
        </div>

        <div class="checkbox-content">
          <div class="checkbox-container">
            <!-- <label class="checkbox-policy">
                <input type="checkbox" />
                <span class="checkmark"></span>
                <p>I've read the <span> privacy policy </span></p>
                <p>and agree to the processing of my data as outlined.</p>
              </label>
               <span class="after-agree">  </span>
              -->
            <div class="checkout-img">
              <img src="./Icons/check_box_outline_blank.png" alt="check-box" />
            </div>
            <div class="checkout-policy">
              <p>
                I've read the <span> privacy policy </span> and agree
                <span class="after-agree"> </span> to the processing of my data
                as outlined.
              </p>
            </div>
          </div>

          <div class="send-info">
            <button class="button">Send</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
