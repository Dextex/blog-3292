<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
    <title>Blog</title>
  </head>
  <body>
    <section class="contact">
      <div class="contact_form_wrapper">
        <div class="form_content_top">
          <div class="headline_content">
            <div class="image_content">
              <img src="./Icons/person_pin.png" alt="Contact form" />
              <h1>Contact form</h1>
            </div>
          </div>
          <div class="description_form">
            <h3>
              Have a question or an idea to collaborate? <br />
              Get in touch—I'd love to hear from you and explore how we can work
              together.
            </h3>
          </div>
        </div>

        <div class="information_collected">
          <div class="name">
            <h3>What's your name?</h3>
            <hr />
          </div>
          <!--<hr class="horizontal-line" /> -->
          <div class="email">
            <h3>What's your email?</h3>
            <hr />
          </div>
        </div>

        <div class="help">
          <h3>How can I help?</h3>
        </div>
        <hr />

        <div class="checkbox-content">
          <div class="checkbox-container">
            <div class="container">
              <label class="checkbox-policy">
                <input type="checkbox" />
                <span class="checkmark"></span>
              </label>
            </div>

            <div class="read-policy">
              <p>I've read the</p>
              <span> privacy policy </span>
              <p>and agree to the processing of my data as outlined.</p>
            </div>
          </div>
          <div class="send-info">
            <button class="button">Send</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
